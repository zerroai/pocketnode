<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pocketnode</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="/favicon.svg">
<style>
:root{--bg:#FFFFFF;--grouped:#F2F3F5;--surface:#FFFFFF;--fill:#F0F1F3;--pressed:#E3E5E9;--sep:#E1E3E7;--text:#0A0A0C;--text2:#5B5F69;--text3:#686D77;--accent:#17181C;--on:#FFFFFF;--soft:rgba(0,0,0,.08);--err:#C4122F;--scrim:rgba(0,0,0,.45);--sidebar:#F7F8F9}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0A0A0C;--grouped:#0A0A0C;--surface:#17181C;--fill:#1F2025;--pressed:#2A2C32;--sep:#2A2C32;--text:#F5F6F8;--text2:#A5A9B2;--text3:#8A8F99;--accent:#D5D8DE;--on:#0A0A0C;--soft:rgba(255,255,255,.14);--err:#FF6B7F;--scrim:rgba(0,0,0,.6);--sidebar:#101114}}
:root[data-theme=dark]{--bg:#0A0A0C;--grouped:#0A0A0C;--surface:#17181C;--fill:#1F2025;--pressed:#2A2C32;--sep:#2A2C32;--text:#F5F6F8;--text2:#A5A9B2;--text3:#8A8F99;--accent:#D5D8DE;--on:#0A0A0C;--soft:rgba(255,255,255,.14);--err:#FF6B7F;--scrim:rgba(0,0,0,.6);--sidebar:#101114}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}body{background:var(--grouped);color:var(--text);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0;padding:0}
[hidden]{display:none!important}
#app{position:relative;max-width:640px;height:100dvh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:700px){#app{border-left:1px solid var(--sep);border-right:1px solid var(--sep)}}
.scr{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}.scr.g{background:var(--grouped)}
.top{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:6px 8px}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--accent)}.ib:active{background:var(--pressed)}
.body{flex:1;min-height:0;overflow:auto;padding-bottom:24px}
h1.lt{font-size:34px;line-height:40px;font-weight:700;letter-spacing:-.9px;margin:0;padding:0 20px 10px}
h2.t{font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.4px;margin:0 0 6px}
.sub{color:var(--text2);margin:0}
.sec{font-size:13px;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;padding:18px 20px 6px;margin:0}.foot{font-size:13px;color:var(--text2);padding:6px 20px 0;margin:0}
.list{background:var(--surface);border-radius:14px;margin:0 16px;overflow:hidden}.scr:not(.g) .list{background:var(--fill)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 16px;position:relative;min-height:52px}.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--sep)}
.row:active{background:var(--pressed)}.row .g1{flex:1;min-width:0}.row .a{font-weight:500}.row .b{font-size:14px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .v{color:var(--text2);font-size:15px}.row .ch{color:var(--text3)}
.av{width:36px;height:36px;border-radius:10px;background:var(--fill);display:grid;place-items:center;flex:none;color:var(--accent)}.scr.g .av{background:var(--grouped)}
.btn{display:block;width:100%;background:var(--accent);color:var(--on);border-radius:14px;padding:15px 20px;font-weight:600;text-align:center}.btn:disabled{opacity:.45}.btn:active{opacity:.85}
.btn.sec2{background:var(--fill);color:var(--text)}.txt{display:block;margin:12px auto 0;color:var(--text2);padding:8px}
.pad{padding:0 20px}
input.f,textarea.f{display:block;width:100%;background:var(--fill);border:1px solid transparent;border-radius:12px;padding:13px 14px;outline:0;margin:0 0 10px}input.f:focus,textarea.f:focus{border-color:var(--accent)}
.lbl{display:block;font-size:13px;color:var(--text2);margin:0 0 6px 2px}.err{color:var(--err);font-size:14px;min-height:1.3em;margin:2px 2px 8px}
.hero{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px;overflow:auto}.mark{width:76px;height:76px;border-radius:20px;background:var(--accent);color:var(--on);display:grid;place-items:center;margin:0 auto 18px}
.feat{display:flex;gap:14px;margin:0 0 18px}.feat .av{background:var(--fill)}.feat b{display:block;font-weight:600}.feat span{color:var(--text2);font-size:15px}
.tabs{display:flex;border-top:1px solid var(--sep);background:var(--bg);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text3);font-size:11px;font-weight:500;padding:4px}.tabs button.on{color:var(--text)}
.empty{text-align:center;color:var(--text2);padding:40px 30px}.empty .av{margin:0 auto 12px;width:56px;height:56px;border-radius:16px}
#log{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:8px 16px 14px}
.m{max-width:86%;padding:10px 15px;border-radius:20px;white-space:pre-wrap;overflow-wrap:anywhere}.m.me{align-self:flex-end;background:var(--accent);color:var(--on);border-bottom-right-radius:6px}.m.bot{align-self:flex-start;background:var(--fill);border-bottom-left-radius:6px}
.chip{align-self:flex-start;font-size:13px;color:var(--text2);border:1px solid var(--sep);border-radius:10px;padding:3px 10px;display:flex;gap:6px;align-items:center}.chip i{width:7px;height:7px;border-radius:50%;background:var(--text3)}.chip.bad i{background:var(--err)}
.open{align-self:flex-start;border:1px solid var(--accent);color:var(--text);border-radius:12px;padding:8px 14px;text-decoration:none;font-weight:600;overflow-wrap:anywhere}
.box{align-self:stretch;border:1px solid var(--sep);border-radius:16px;overflow:hidden;background:var(--surface);flex:none}
.box .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px 8px 14px;border-bottom:1px solid var(--sep);font-size:14px}.box .bar b{font-weight:600}.box .bar span{color:var(--text2);font-size:12px}.box .bar button{color:var(--text);text-decoration:underline;font-size:13px;flex:none}
.box iframe{display:block;width:100%;height:340px;border:0;background:#fff}
.box .out{padding:8px 14px;font:13px/1.5 ui-monospace,Menlo,monospace;color:var(--text2);border-top:1px solid var(--sep);max-height:130px;overflow:auto}.out .blocked{color:var(--err);font-weight:600}.out .error{color:var(--err)}
.composer{display:flex;align-items:flex-end;gap:6px;padding:8px 10px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--sep);background:var(--bg)}
.composer textarea{flex:1;background:var(--fill);border:0;border-radius:22px;padding:11px 16px;outline:0;resize:none;max-height:120px;line-height:1.4}
.send{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--on);display:grid;place-items:center;flex:none}.send.rec{background:var(--err)}
.sw{width:50px;height:30px;border-radius:15px;background:var(--pressed);position:relative;flex:none;transition:.15s}.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}.sw.on{background:var(--accent)}.sw.on::after{left:23px;background:var(--on)}
.seg{display:flex;background:var(--fill);border-radius:12px;padding:3px;margin:0 16px}.seg button{flex:1;padding:8px;border-radius:9px;font-weight:500}.seg button.on{background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.tour{position:fixed;inset:0;z-index:50}.tour .spot{position:absolute;border-radius:14px;box-shadow:0 0 0 9999px var(--scrim);transition:all .2s}.tour .card{position:absolute;left:16px;right:16px;max-width:420px;margin:0 auto;background:var(--surface);border:1px solid var(--sep);border-radius:18px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.tour .card h3{margin:0 0 6px;font-size:18px}.tour .card p{margin:0 0 14px;color:var(--text2);font-size:15px}.tour .acts{display:flex;justify-content:space-between;align-items:center;gap:10px}.tour .acts .btn{width:auto;padding:10px 22px}.tour .acts span{color:var(--text3);font-size:13px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--accent);color:var(--on);padding:10px 18px;border-radius:14px;z-index:60;font-size:15px}
.m.bot{white-space:normal}.m.bot>*:first-child{margin-top:0}.m.bot>*:last-child{margin-bottom:0}.m.bot p{margin:0 0 .6em}.m.bot h3,.m.bot h4,.m.bot h5{margin:.8em 0 .3em;font-size:1.02em;line-height:1.3}.m.bot ul,.m.bot ol{margin:0 0 .6em;padding-left:1.3em}.m.bot li{margin:.1em 0}
.m.bot code{font:.88em ui-monospace,Menlo,monospace;background:var(--pressed);padding:.1em .35em;border-radius:5px}.m.bot pre{background:var(--surface);border:1px solid var(--sep);border-radius:12px;padding:10px 12px;overflow:auto;margin:.4em 0 .7em}.m.bot pre code{background:none;padding:0}
.m.bot a{color:var(--text);text-underline-offset:2px}.m.bot table{border-collapse:collapse;margin:.4em 0 .7em;display:block;overflow:auto;font-size:.95em}.m.bot th,.m.bot td{border:1px solid var(--sep);padding:5px 10px;text-align:left}.m.bot th{background:var(--pressed)}.m.bot hr{border:0;border-top:1px solid var(--sep);margin:.8em 0}
.hello{margin:auto;text-align:center;padding:30px 10px;color:var(--text2)}.hello .mark{width:60px;height:60px;border-radius:16px}.hello h2{margin:0 0 4px;color:var(--text);font-size:26px;letter-spacing:-.5px}
#app.desk{max-width:none;flex-direction:row;border:0}
.side{width:290px;flex:none;display:flex;flex-direction:column;background:var(--sidebar);border-right:1px solid var(--sep);padding:12px 10px calc(12px + env(safe-area-inset-bottom));min-height:0}
.sb{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;font-size:18px;font-weight:700;letter-spacing:-.3px}.sb .mk{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--on);display:grid;place-items:center}
.sn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;font-weight:500}.sn:hover{background:var(--soft)}.sn.on{background:var(--pressed)}.sn.new{border:1px solid var(--sep);background:var(--bg);margin-bottom:8px}
.hist{flex:1;min-height:60px;overflow:auto;margin:4px 0 8px}.hist .cap{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;padding:8px 12px 4px}.hist .none{color:var(--text3);font-size:14px;padding:6px 12px}
.hi{display:flex;align-items:center;border-radius:10px;position:relative}.hi:hover{background:var(--soft)}.hi.on{background:var(--pressed)}.hi>button.t{flex:1;min-width:0;text-align:left;padding:8px 12px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hi .x{display:none;width:30px;height:30px;place-items:center;color:var(--text3);margin-right:4px}.hi:hover .x{display:grid}
.sbot{border-top:1px solid var(--sep);padding-top:8px;display:flex;flex-direction:column;gap:2px}.who{display:flex;gap:10px;align-items:center;padding:10px 12px 0;color:var(--text2);font-size:14px;overflow:hidden}.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pane{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.desk{--gut:max(20px,calc((100% - 820px)/2))}
.desk .pane .body,.desk .pane #log,.desk .pane #sugg,.desk .pane h1.lt,.desk .pane .top,.desk .pane .composer{padding-left:var(--gut);padding-right:var(--gut)}
.desk .pane .composer{border-top:0}.desk .pane .composer textarea{border:1px solid var(--sep);background:var(--surface)}
.desk .pane #sugg .list{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:none;margin:0}.desk .pane #sugg .row{background:var(--fill);border-radius:14px}.desk .pane #sugg .row+.row::before{display:none}.desk .pane #sugg .sec{padding-left:0}
.desk .pane .list{margin-left:0;margin-right:0}.desk .pane .foot,.desk .pane .sec,.desk .pane .empty{padding-left:0;padding-right:0}.desk .pane .seg{margin:0}.desk .pane .pad{padding:0}
.desk #gear{display:none}
.cvs{flex:1;min-height:0;display:flex}.cvs iframe{flex:1;border:0;background:#fff}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P={chat:'M4 5h16v11H9l-5 4z',files:'M6 3h8l4 4v14H6zM14 3v4h4',packs:'M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5',agents:'M12 3v3M8 6h8v6H8zM6 14h12v7H6zM10 9h.01M14 9h.01',plus:'M12 5v14M5 12h14',back:'M15 5l-7 7 7 7',chev:'M9 5l7 7-7 7',gear:'M12 15a3 3 0 100-6 3 3 0 000 6zM19 12h2M3 12h2M12 3v2M12 19v2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4',mic:'M12 3a3 3 0 013 3v6a3 3 0 01-6 0V6a3 3 0 013-3zM6 11a6 6 0 0012 0M12 17v4',send:'M12 19V5M6 11l6-6 6 6',clip:'M20 11l-8.5 8.5a5 5 0 01-7-7L13 4a3.5 3.5 0 015 5l-8.5 8.5a2 2 0 01-3-3L14 7',lock:'M6 11h12v9H6zM8 11V8a4 4 0 018 0v3',server:'M4 4h16v6H4zM4 14h16v6H4zM8 7h.01M8 17h.01',trash:'M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13',globe:'M12 3a9 9 0 100 18 9 9 0 000-18zM3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18',code:'M9 8l-5 4 5 4M15 8l5 4-5 4',tab:'M4 6h16v13H4zM4 10h16M8 6V4',speak:'M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 010 6',stop:'M7 7h10v10H7z',user:'M12 12a4 4 0 100-8 4 4 0 000 8zM4 21a8 8 0 0116 0',help:'M12 17h.01M9.5 9a2.5 2.5 0 115 0c0 1.5-2.5 2-2.5 4M12 3a9 9 0 100 18 9 9 0 000-18z',canvas:'M4 4h16v16H4zM4 9h16M9 9v11'};
const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${P[n]}"/></svg>`;
const api=async(p,b)=>{try{const r=await fetch(p,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});let j={};try{j=await r.json()}catch(e){}return{ok:r.ok,j}}catch(e){return{ok:false,j:{error:'Cannot reach the server.'}}}};
const uid=()=>Math.random().toString(36).slice(2,10);
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}

/* ---------- markdown ---------- */
function md(src){const code=[];let s=String(src).replace(/```[\w-]*\n?([\s\S]*?)```/g,(_,c)=>{code.push(c.replace(/\n$/,''));return '\u0000'+(code.length-1)+'\u0000'});s=esc(s);
 const il=t=>t.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*\w])\*([^*\s][^*\n]*)\*/g,'$1<i>$2</i>').replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>').replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
 const out=[];let list=null,para=[],tbl=[];
 const fp=()=>{if(para.length){out.push('<p>'+il(para.join('<br>'))+'</p>');para=[]}},fl=()=>{if(list){out.push('</'+list+'>');list=null}},ft=()=>{if(tbl.length){const rows=tbl.filter(r=>!/^\s*\|?[\s:|-]+\|?\s*$/.test(r)||!/-/.test(r));const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>il(c.trim()));out.push('<table>'+rows.map((r,i)=>'<tr>'+cells(r).map(c=>i?'<td>'+c+'</td>':'<th>'+c+'</th>').join('')+'</tr>').join('')+'</table>');tbl=[]}},fa=()=>{fp();fl();ft()};
 for(const line of s.split('\n')){let m;
  if(m=/^\u0000(\d+)\u0000$/.exec(line.trim())){fa();out.push('<pre><code>'+esc(code[+m[1]])+'</code></pre>');continue}
  if(/^\s*\|.*\|\s*$/.test(line)){fp();fl();tbl.push(line);continue}else ft();
  if(m=/^(#{1,4})\s+(.*)$/.exec(line)){fa();const n=Math.min(m[1].length+2,5);out.push('<h'+n+'>'+il(m[2])+'</h'+n+'>');continue}
  if(/^\s*(-{3,}|\*{3,})\s*$/.test(line)){fa();out.push('<hr>');continue}
  if(m=/^\s*[-*+]\s+(.*)$/.exec(line)){fp();if(list!=='ul'){fl();out.push('<ul>');list='ul'}out.push('<li>'+il(m[1])+'</li>');continue}
  if(m=/^\s*\d+[.)]\s+(.*)$/.exec(line)){fp();if(list!=='ol'){fl();out.push('<ol>');list='ol'}out.push('<li>'+il(m[1])+'</li>');continue}
  if(!line.trim()){fa();continue}
  fl();para.push(line)}
 fa();return out.join('').replace(/\u0000(\d+)\u0000/g,(_,i)=>'<pre><code>'+esc(code[+i])+'</code></pre>')}
const desk=()=>innerWidth>=900;

/* ---------- state ---------- */
let user=null,limit=40,S=null,nav=[{r:'boot'}],tab=0,busy=false,stopFlag=false;
const PACKS=[['web','globe','Web','Search the web and read pages.'],['tabs','tab','Browser tabs','Open pages in new tabs for you.'],['code','code','Code','Write and run programs in a locked frame.'],['voice','speak','Voice','Read answers out loud.'],['files','files','Files','Save text files from the chat.']];
const TOOLPACK={web_search:'web',web_read:'web',open_tab:'tabs',run_code:'code',speak:'voice',download_file:'files'};
const IDEAS=[['Build me a 5-minute pomodoro timer I can use right now','Pomodoro timer'],['Draw an animated chart of the Fibonacci sequence','Animated chart'],['Containment test: write code that tries to read this page\'s cookies and storage, call another website, open a popup, and then run an infinite loop. Tell me what the sandbox blocked or stopped.','Containment test'],['Search the web for Vultr serverless inference and open the top result in a new tab','Search and open a tab']];
const key=()=>'pn:'+user;
function load(){let d={};try{d=JSON.parse(localStorage.getItem(key())||'{}')}catch(e){}S=Object.assign({threads:[],files:[],agents:[],canvases:[],activity:[],packs:{web:1,tabs:1,code:1,voice:1,files:1},on:true,onboarded:false,theme:'auto'},d);if(!S.agents.length&&!d.onboarded)S.agents=IDEAS.slice(0,3).map(([p,n])=>({id:uid(),name:n,prompt:p}));applyTheme()}
function save(){try{localStorage.setItem(key(),JSON.stringify(S))}catch(e){toast('Browser storage is full. Delete some chats or files.')}}
function applyTheme(){const t=S?S.theme:'auto';if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)}
const logA=(tool,detail,ok=true)=>{S.activity.unshift({t:Date.now(),tool,detail:String(detail||'').slice(0,160),ok});S.activity.length=Math.min(S.activity.length,150);save()};
const ago=t=>{const s=(Date.now()-t)/1000;return s<60?'now':s<3600?Math.floor(s/60)+' min':s<86400?Math.floor(s/3600)+' h':new Date(t).toLocaleDateString()};

/* ---------- navigation ---------- */
function go(r,a){nav.push(Object.assign({r},a||{}));render()}
function back(){if(nav.length>1)nav.pop();render()}
function reset(r,a){nav=[Object.assign({r},a||{})];render()}
const cur=()=>nav[nav.length-1];
function bar(title,o={}){return `<div class="top">${o.back&&nav.length>1?`<button class="ib" data-back aria-label="Back">${ic('back',26)}</button>`:'<span style="width:44px"></span>'}<b style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:60%">${o.small?esc(title):''}</b>${o.right||'<span style="width:44px"></span>'}</div>`}
const APPR=['main','thread','settings','activity','file','canvas','agent'];
function mkTh(){return{id:uid(),title:'New chat',preview:'',created:Date.now(),updated:Date.now(),convo:[],items:[],draft:true}}
function side(t){const L=S.threads.slice().sort((a,b)=>b.updated-a.updated),cid=t.r==='thread'?(t.th?t.th.id:t.id):null;
 const nb=(id,ico,label,on,tour)=>`<button class="sn ${on?'on':''}" data-sn="${id}" data-tour="${tour}">${ic(ico,20)}<span>${label}</span></button>`;
 return `<aside class="side"><div class="sb"><span class="mk">${ic('server',18)}</span>Pocketnode</div>
<button class="sn new" data-sn="new" data-tour="chats_plus">${ic('plus',20)}<span>New chat</span></button>

const CSP='<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; script-src \'unsafe-inline\'; style-src \'unsafe-inline\'; img-src data: blob:; media-src data:">';
const BRIDGE='<script>(function(){var id="__ID__";function send(k,t){try{parent.postMessage({pn:id,k:k,t:String(t).slice(0,500)},"*")}catch(e){}}'
 +'["log","info","warn","error"].forEach(function(k){var o=console[k];console[k]=function(){send(k,[].map.call(arguments,function(a){try{return typeof a==="object"?JSON.stringify(a):String(a)}catch(e){return String(a)}}).join(" "));try{o&&o.apply(console,arguments)}catch(e){}}});'
 +'setInterval(function(){send("hb","")},500);addEventListener("error",function(e){send("error",e.message)});addEventListener("unhandledrejection",function(e){send("error","Unhandled: "+(e.reason&&e.reason.message||e.reason))});'
 +'document.addEventListener("securitypolicyviolation",function(e){send("blocked",e.violatedDirective+" blocked "+(e.blockedURI||"inline"))});})()<\/script>';
function wrap(html,id){const inj=CSP+BRIDGE.replace('__ID__',id);const m=/^\s*<!doctype[^>]*>/i.exec(html);return m?m[0]+inj+html.slice(m[0].length):inj+html}
let TH=null;
function node(it){const L=$('#log');if(!L)return null;const hl=L.querySelector('.hello');if(hl)hl.remove();let n;
 if(it.t==='me'||it.t==='bot'){n=document.createElement('div');n.className='m '+it.t;if(it.t==='bot')n.innerHTML=md(it.x);else n.textContent=it.x}
 else if(it.t==='chip'){n=document.createElement('div');n.className='chip'+(it.bad?' bad':'');n.innerHTML='<i></i>';n.append(it.x)}
 else if(it.t==='open'){n=document.createElement('a');n.className='open';n.href=it.u;n.target='_blank';n.rel='noopener noreferrer';n.textContent=(it.opened?'Opened in a new tab: ':'Open in a new tab: ')+it.u}
 else if(it.t==='file'){n=document.createElement('a');n.className='open';n.href='#';n.textContent='Saved '+it.name+' to Files';n.onclick=e=>{e.preventDefault();const f=S.files.find(x=>x.id===it.fid);if(f)go('file',{id:f.id})}}
 else if(it.t==='code'){const id='f'+uid();n=document.createElement('div');n.className='box';n.innerHTML='<div class="bar"><b></b><span>Locked frame: no network, no cookies</span><button>Save to Canvas</button></div>';n.querySelector('b').textContent=it.title||'Program';
  n.querySelector('button').onclick=e=>{S.canvases.push({id:uid(),name:it.title||'Program',html:it.html});save();e.target.textContent='Saved';e.target.disabled=true};
  const f=document.createElement('iframe');f.setAttribute('sandbox','allow-scripts');f.srcdoc=wrap(it.html,id);n.appendChild(f);const out=document.createElement('div');out.className='out';out.hidden=true;n.appendChild(out);
  const res={logs:[],errors:[],blocked:[],last:Date.now()+3000};
  const on=e=>{if(e.source!==f.contentWindow||!e.data||e.data.pn!==id)return;const {k,t}=e.data;if(k==='hb'){res.last=Date.now();return}out.hidden=false;const l=document.createElement('div');l.className=k==='blocked'?'blocked':k==='error'?'error':'';l.textContent=(k==='blocked'?'Blocked: ':k==='error'?'Error: ':'')+t;out.appendChild(l);out.scrollTop=out.scrollHeight;(k==='blocked'?res.blocked:k==='error'?res.errors:res.logs).push(t)};
  addEventListener('message',on);it._res=res;
  const wd=setInterval(()=>{if(!n.isConnected){clearInterval(wd);removeEventListener('message',on);return}if(document.hidden){res.last=Date.now();return}
   if(Date.now()-res.last>4000){clearInterval(wd);f.remove();out.hidden=false;const l=document.createElement('div');l.className='error';l.textContent='Stopped: the program stopped responding for 4 seconds (an infinite loop?). The frame was removed. This page is fine.';out.appendChild(l);res.errors.push('Stopped by the watchdog: the program froze (infinite loop). Frame removed.');res.stopped=true}},1000)}
 L.appendChild(n);n.scrollIntoView({block:'end'});return n}
function add(it){if(TH.draft){delete TH.draft;S.threads.push(TH);refreshSide();const tb=$('.pane .top b,.scr>.top b');if(tb)tb.textContent=TH.title}const stored=it.t==='code'?{t:'code',title:it.title,html:it.html}:it;TH.items.push(stored);const n=node(it);TH.updated=Date.now();save();return n}
async function exec(name,args){
 const pk=TOOLPACK[name];if(pk&&!S.packs[pk]){add({t:'chip',x:'Skipped '+name+' (pack is off)',bad:true});logA(name,'pack is off',false);return{error:'That pack is switched off by the user.'}}
 if(name==='web_search'||name==='web_read'||name==='now'){const {ok,j}=await api('/api/tool',{name,args});const lbl=name==='web_search'?'Searched: '+(args.query||''):name==='web_read'?'Read '+String(args.url||'a page').slice(0,60):'Checked the time';add({t:'chip',x:lbl+(j.error?' · '+j.error:j.results?' · '+j.results.length+' results':''),bad:!!j.error});logA(name,args.query||args.url||'',!j.error);return ok?j:{error:j.error||'failed'}}
 if(name==='open_tab'){const url=String(args.url||'');if(!/^https?:\/\/\S+$/.test(url))return{error:'Not a web address.'};const w=window.open(url,'_blank','noopener');add({t:'open',u:url,opened:!!w});logA('open_tab',url);return{ok:true,opened:!!w,note:w?'Opened.':'The browser blocked the popup; a link was shown to the user.'}}
 if(name==='run_code'){const it={t:'code',title:args.title,html:String(args.html||'')};add(it);logA('run_code',args.title||'program');await new Promise(r=>setTimeout(r,2000));const r=it._res||{logs:[],errors:[],blocked:[]};if(r.last&&Date.now()-r.last>1500)for(let i=0;i<8&&!r.stopped;i++)await new Promise(q=>setTimeout(q,500));return{ok:!r.errors.length,logs:r.logs.slice(0,20),errors:r.errors.slice(0,10),blocked_by_sandbox:r.blocked.slice(0,10),note:'The program is running in the frame. It cannot use the network, cookies or the page around it.'}}
 if(name==='speak'){try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(String(args.text||'').slice(0,500)));add({t:'chip',x:'Speaking'});logA('speak',args.text);return{ok:true}}catch(e){return{error:'Speech is not available here.'}}}
 if(name==='download_file'){const fn=String(args.filename||'file.txt').replace(/[^\w.\- ]/g,'_').slice(0,80),f={id:uid(),name:fn,content:String(args.content||'').slice(0,100000),time:Date.now()};S.files.push(f);add({t:'file',name:fn,fid:f.id});logA('download_file',fn);return{ok:true,note:'Saved in the Files tab.'}}
 return{error:'Unknown tool.'}}
async function sendMsg(t){if(busy||!t.trim())return;if(!S.on){toast('The assistant is switched off in Settings.');return}
 busy=true;stopFlag=false;setSend();if($('#sugg'))$('#sugg').innerHTML='';
 if(TH.title==='New chat')TH.title=t.slice(0,40);TH.preview=t.slice(0,80);add({t:'me',x:t});TH.convo.push({role:'user',content:t});
 const wait=document.createElement('div');wait.className='m bot';wait.textContent='Working on it…';$('#log').appendChild(wait);wait.scrollIntoView({block:'end'});
 try{for(let i=0;i<8&&!stopFlag;i++){
   const {ok,j}=await api('/api/step',{messages:TH.convo.slice(-40)});wait.remove();
   if(!ok){if(j.error==='Log in first.'){location.reload();return}add({t:'bot',x:j.error||'Something went wrong.'});TH.convo.pop();break}
   const m=j.message;TH.convo.push(m);if(m.content)add({t:'bot',x:m.content});else if(!(m.tool_calls&&m.tool_calls.length))add({t:'bot',x:'I did not get an answer back. Please try again.'});
   if(!m.tool_calls||!m.tool_calls.length)break;
   for(const c of m.tool_calls){let args={};try{args=JSON.parse(c.function.arguments||'{}')}catch(_){}
    let r;try{r=await exec(c.function.name,args)}catch(err){r={error:String(err).slice(0,120)}}
    TH.convo.push({role:'tool',tool_call_id:c.id,content:JSON.stringify(r).slice(0,8000)})}
   if(i===7)add({t:'bot',x:'I stopped after several steps. Ask me to continue if you want more.'});
   else if($('#log'))$('#log').appendChild(wait)}
 }catch(err){add({t:'bot',x:'Something went wrong. Try again.'})}
 wait.remove();busy=false;setSend();save()}
let rec=null;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function setSend(){const b=$('#send'),m=$('#msg');if(!b)return;const empty=!m.value.trim();b.classList.toggle('rec',!!rec);b.innerHTML=busy?ic('stop'):(empty&&SR)?ic('mic'):ic('send');b.setAttribute('aria-label',busy?'Stop':empty&&SR?'Speak':'Send')}
AFTER.thread=t=>{TH=t.th||S.threads.find(x=>x.id===t.id);if(!TH){reset('main');return}if($('#delth'))$('#delth').onclick=()=>delThread(TH.id);if(!TH.items.length)$('#log').innerHTML=`<div class="hello"><div class="mark">${ic('server',30)}</div><h2>What can I do for you?</h2><p>I can search the web, open pages in new tabs, and write and run code right here.</p></div>`;TH.items.forEach(i=>node(i));const m=$('#msg');
 const sg=$('#sugg');if(!TH.items.length){sg.innerHTML=`<p class="sec" style="padding-top:0">Not sure what to ask?</p><div class="list" data-tour="suggestions">${IDEAS.map((x,i)=>`<button type="button" class="row" data-i="${i}"><div class="g1"><span class="a">${esc(x[1])}</span></div><span class="ch">${ic('chev',18)}</span></button>`).join('')}</div><div style="height:10px"></div>`;$$('[data-i]').forEach(b=>b.onclick=()=>sendMsg(IDEAS[b.dataset.i][0]))}
 m.oninput=()=>{m.style.height='auto';m.style.height=Math.min(m.scrollHeight,120)+'px';setSend()};
 m.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#form').requestSubmit()}};
 $('#form').onsubmit=e=>{e.preventDefault();if(busy){stopFlag=true;return}
  if(!m.value.trim()){if(!SR)return;if(rec){rec.stop();return}rec=new SR();rec.interimResults=false;rec.onresult=ev=>{m.value=ev.results[0][0].transcript;m.oninput()};rec.onend=()=>{rec=null;setSend()};rec.start();setSend();return}
  const v=m.value;m.value='';m.style.height='auto';sendMsg(v)};
 $('#attach').onclick=()=>$('#file').click();
 $('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>60000){toast('That file is too big. Keep it under 60 KB.');return}const r=new FileReader();r.onload=()=>{m.value=(m.value?m.value+'\n\n':'')+'File "'+f.name+'":\n'+r.result;m.oninput()};r.readAsText(f)};
 setSend();const seed=t.seed;if(seed){t.seed=null;setTimeout(()=>sendMsg(seed),50)}else if(!TH.items.length)m.focus()};

/* ---------- tour ---------- */
const STEPS=[
 [null,'Welcome to Pocketnode','A one minute tour of the buttons you will use. Tap Next, or skip it and come back from Settings.',()=>{tab=0;reset('main')}],
 ['tab_chats','Chats','Every conversation lives here, newest first. Each one is a separate thread with your assistant.',()=>{tab=0;reset('main')}],
 ['chats_plus','Start a new chat','Tap the plus to begin. Talk to it the way you would text a helpful friend.'],
 ['composer_field','Say what you want','Type here. Ask it to build something, search the web, or open a page in a new tab.',()=>{if(cur().r!=='thread')newThread()}],
 ['composer_plus','Add a file','Attach a text file and the assistant reads it.'],
 ['composer_send','Speak or send','With nothing typed this is the microphone, if your browser has one. Once you type, it becomes the send button. While it works, it turns into Stop.'],
 ['suggestions','Not sure what to ask?','Tap any idea and it is sent for you.'],
 ['tab_files','Files','Files the assistant saves are kept here, in this browser. Tap one to read it or save a copy.',()=>{tab=1;reset('main')}],
 ['tab_packs','Packs','Packs give your assistant abilities: web, new tabs, code, voice and files. Switch them on or off whenever you like.',()=>{tab=2;reset('main')}],
 ['tab_agents','Agents and Canvas','Save an instruction as an agent and run it any time. Programs the assistant writes can be saved to Canvas.',()=>{tab=3;reset('main')}],
 ['settings_assistant','The big switch','Switch the assistant off here and nothing runs. While it works, a Stop button appears in the chat.',()=>{tab=0;reset('main');go('settings')}],
 ['settings_activity','See everything it did','Every tool it used is listed here. It stays in this browser.'],
 [null,'You are ready','Ask for something small to start, like a 5 minute timer. You can replay this tour from Settings, under Take the tour.',()=>{tab=0;reset('main')}]
];
let ti=0;
function startTour(){ti=0;stepTour()}
async function stepTour(){const old=$('.tour');if(old)old.remove();if(ti>=STEPS.length)return;const [id,title,body,prep]=STEPS[ti];if(prep){await prep();await new Promise(r=>setTimeout(r,200))}
 const el=id?$(`[data-tour="${id}"]`):null;if(id&&!el){ti++;return stepTour()}
 const d=document.createElement('div');d.className='tour';const r=el?el.getBoundingClientRect():null;
 d.innerHTML=(r?`<div class="spot" style="left:${r.left-6}px;top:${r.top-6}px;width:${r.width+12}px;height:${r.height+12}px"></div>`:'<div class="spot" style="left:50%;top:50%;width:0;height:0"></div>')+`<div class="card"><h3>${esc(title)}</h3><p>${esc(body)}</p><div class="acts"><button class="txt" style="margin:0" id="tskip">Skip</button><span>${ti+1} of ${STEPS.length}</span><button class="btn" id="tnext">${ti===STEPS.length-1?'Done':'Next'}</button></div></div>`;
 document.body.appendChild(d);const card=d.querySelector('.card');const h=card.offsetHeight;card.style.top=(r?(r.top<innerHeight/2?Math.min(r.bottom+18,innerHeight-h-12):Math.max(r.top-h-18,12)):(innerHeight/2-h/2))+'px';
 $('#tskip').onclick=()=>d.remove();$('#tnext').onclick=()=>{ti++;stepTour()}}

async function enter(u){user=u;const m=await api('/api/me');limit=(m.j&&m.j.limit)||limit;load();if(S.onboarded){tab=0;reset('main')}else reset('finish')}
(async()=>{const m=await api('/api/me');if(m.ok&&m.j.user){user=m.j.user;limit=m.j.limit||limit;load();if(S.onboarded)reset('main');else reset('finish')}else if(localStorage.getItem('pn:seen'))reset('account',{signup:false});else reset('welcome')})();
</script>
